apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: order-manager

labels:
  - pairs:
      app.kubernetes.io/part-of: order-manager
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - app.yaml
  - scaling.yaml
  - network-policy.yaml

images:
  - name: order-manager
    newName: ghcr.io/owner/order-manager
    newTag: latest
