worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    client_max_body_size 1m;

    log_format main '$remote_addr "$request" $status upstream=$upstream_addr '
                    'rt=$request_time urt=$upstream_response_time rid=$request_id';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    upstream order_manager {
        zone order_manager 64k;
        least_conn;
        server app:8098 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Request-Id $request_id always;
        add_header X-Upstream $upstream_addr always;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location ~ ^/actuator/(health|info)(/.*)?$ {
            proxy_pass http://order_manager;
        }

        location /actuator {
            return 404;
        }

        location / {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://order_manager;
        }
    }
}
