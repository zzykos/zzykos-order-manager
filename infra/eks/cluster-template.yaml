apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER_NAME}
  region: ${AWS_REGION}
  version: "${EKS_VERSION}"
  tags:
    project: order-manager
    course: DOY0101

iam:
  serviceRoleARN: arn:aws:iam::${AWS_ACCOUNT_ID}:role/LabRole
  withOIDC: false

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP
  bootstrapClusterCreatorAdminPermissions: true

vpc:
  nat:
    gateway: Single
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy":"true"}'
  - name: coredns
  - name: kube-proxy
  - name: metrics-server
  - name: amazon-cloudwatch-observability

managedNodeGroups:
  - name: nodos-istio
    instanceType: t3.medium
    minSize: 2
    desiredCapacity: 3
    maxSize: 4
    volumeSize: 20
    volumeType: gp3
    privateNetworking: true
    iam:
      instanceRoleARN: arn:aws:iam::${AWS_ACCOUNT_ID}:role/LabRole
    labels:
      workload: order-manager
    tags:
      project: order-manager

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
    logRetentionInDays: 7
