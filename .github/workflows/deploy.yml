name: Deploy (reutilizable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      replicas:
        required: true
        type: number
      http-port:
        required: false
        type: string
        default: "8098"
      tests:
        required: false
        type: string
        default: ""
      coverage:
        required: false
        type: string
        default: ""
    outputs:
      digest:
        value: ${{ jobs.deploy.outputs.digest }}

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: "Deploy · ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.trace.outputs.digest }}
    env:
      APP_IMAGE: ${{ inputs.image }}
      APP_VERSION: 1.0.0-run.${{ github.run_number }}
      GIT_COMMIT: ${{ github.sha }}
      APP_REPLICAS: ${{ inputs.replicas }}
      HTTP_PORT: ${{ inputs.http-port }}
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Login en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar credenciales efímeras de BD
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "DB_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Validar manifiesto de orquestación
        run: docker compose config --quiet

      - name: Desplegar (pull imagen por SHA + up con healthchecks)
        run: |
          docker compose pull app gateway db
          docker compose up -d --no-build --wait --wait-timeout 240
          docker compose ps

      - name: Verificar trazabilidad (imagen desplegada = commit)
        id: trace
        run: |
          for c in $(docker compose ps -q app); do
            rev=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$c")
            echo "contenedor ${c:0:12} → revision=$rev"
            [ "$rev" = "$GITHUB_SHA" ] || { echo "::error::El contenedor $c no corresponde al commit $GITHUB_SHA"; exit 1; }
          done
          echo "digest=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$APP_IMAGE")" >> "$GITHUB_OUTPUT"
          echo "replicas=$(docker compose ps -q app | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Pruebas de humo
        env:
          EXPECTED_REPLICAS: ${{ inputs.replicas }}
        run: ./scripts/smoke-test.sh "http://localhost:${HTTP_PORT}"

      - name: Resumen de despliegue
        if: always()
        env:
          TESTS: ${{ inputs.tests }}
          COVERAGE: ${{ inputs.coverage }}
          DIGEST: ${{ steps.trace.outputs.digest }}
          REPLICAS: ${{ steps.trace.outputs.replicas }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Despliegue en \`${DEPLOY_ENV}\` — $([ "$STATUS" = success ] && echo 'exitoso' || echo 'fallido')"
            echo
            echo "| Trazabilidad | Valor |"
            echo "|---|---|"
            echo "| Entorno | \`${DEPLOY_ENV}\` (Docker Compose) |"
            echo "| Commit | [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) — $(echo "$COMMIT_MSG" | head -n1) |"
            echo "| Autor | @${GITHUB_ACTOR} |"
            echo "| Rama | \`${GITHUB_REF_NAME}\` |"
            echo "| Ejecución | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Imagen | \`${APP_IMAGE}\` |"
            echo "| Digest | \`${DIGEST:-n/d}\` |"
            echo "| Versión | \`${APP_VERSION}\` |"
            echo "| Pruebas | ${TESTS:-n/d} aprobadas, cobertura ${COVERAGE:-n/d} |"
            echo "| Réplicas app | ${REPLICAS:-0} detrás del gateway nginx |"
            echo
            echo "### Estado de los servicios"
            echo '```'
            docker compose ps --format 'table {{.Service}}\t{{.Status}}\t{{.Image}}'
            echo '```'
            echo "### Consumo vs. límites de recursos"
            echo '```'
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs ante fallo
        if: failure()
        run: docker compose logs --tail=200

      - name: Liberar entorno simulado
        if: always()
        run: docker compose down -v
