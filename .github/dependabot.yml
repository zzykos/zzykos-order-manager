version: 2
updates:

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      spring:
        patterns:
          - "org.springframework*"
        update-types: [minor, patch]
      test-and-plugins:
        patterns:
          - "org.jacoco*"
          - "org.sonarsource*"
          - "*junit*"
          - "*mockito*"
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.tomcat.embed:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Santiago
    commit-message:
      prefix: "build(docker)"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Santiago
    commit-message:
      prefix: "build(compose)"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Santiago
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
