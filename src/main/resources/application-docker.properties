spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:orderdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:orders}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
server.error.include-stacktrace=never
management.endpoint.health.show-details=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
info.app.version=${APP_VERSION:dev}
info.app.commit=${GIT_COMMIT:unknown}
management.info.env.enabled=true

server.port=${SERVER_PORT:8098}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
