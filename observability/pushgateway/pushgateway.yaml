apiVersion: v1
kind: ServiceAccount
metadata:
  name: pushgateway
  namespace: istio-system
  labels:
    app: pushgateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: istio-system
  labels:
    app: pushgateway
  annotations:
    prometheus.io/probe: pushgateway
spec:
  type: ClusterIP
  selector:
    app: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: istio-system
  labels:
    app: pushgateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: pushgateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pushgateway
          image: docker.io/prom/pushgateway:v1.11.4
          args:
            - --persistence.file=/data/metrics
            - --persistence.interval=1m
            - --web.listen-address=:9091
          ports:
            - name: http
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
